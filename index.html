<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <!--app-head-->
    <script>
      // Runs before the first paint, so there is no flash of the wrong theme or content.
      //
      // Theme: every visit starts in light (data-theme="light" on <html>); the
      // navbar toggle switches to dark for the rest of the visit.
      //
      // Page boot states, on <html>:
      //   .js              hidden "before reveal" styles apply (see index.css)
      //   [data-app=ready] React has mounted (set in App.jsx)
      // If the app hasn't mounted within 4 s (script blocked, failed or very slow),
      // drop .js so the pre-rendered content simply stays visible.
      //
      // Loading screen (src/components/Loader): .loading shows it. Only once per
      // visit (sessionStorage) and never with reduced motion. Fail-safe: whatever
      // happens, it's removed after 3 s, and "loader:done" lets the page carry on.
      (function () {
        var root = document.documentElement;
        root.dataset.theme = "light";

        root.classList.add("js");
        setTimeout(function () {
          if (root.dataset.app !== "ready") root.classList.remove("js");
        }, 4000);

        // Never on the 404 page (its head has robots noindex); the visit's loader then
        // still shows on the first real page.
        var notFound = !!document.querySelector('meta[name="robots"][content~="noindex"]');
        var show = false;
        try {
          show = !notFound && !sessionStorage.getItem("loader-shown") && !matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (show) sessionStorage.setItem("loader-shown", "1");
        } catch (e) {
          show = false; // storage blocked: skip the loading screen rather than risk showing it every time
        }
        if (show) {
          root.classList.add("loading");
          setTimeout(function () {
            if (!root.classList.contains("loading")) return;
            root.classList.remove("loading");
            window.dispatchEvent(new Event("loader:done"));
          }, 3000);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
