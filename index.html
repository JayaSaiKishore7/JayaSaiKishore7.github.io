<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <!--app-head-->
    <script>
      // Page boot states, on <html>:
      //   .js              hidden "before reveal" styles apply (see index.css)
      //   [data-app=ready] React has mounted (set in App.jsx)
      // If the app hasn't mounted within 4 s (script blocked, failed or very slow),
      // drop .js so the pre-rendered content simply stays visible.
      document.documentElement.classList.add("js");
      setTimeout(function () {
        if (document.documentElement.dataset.app !== "ready") {
          document.documentElement.classList.remove("js");
        }
      }, 4000);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
