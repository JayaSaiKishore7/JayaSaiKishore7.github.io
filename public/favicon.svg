<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Colours from src/theme/theme.js: light accent, and the dark theme's accent and bg.
       The "j" is drawn with shapes (no font), so it looks the same in every browser. -->
  <style>
    .tile { fill: #A84300; }
    .ink { fill: #FFFFFF; }
    .stroke { fill: none; stroke: #FFFFFF; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #FF8A3D; }
      .ink { fill: #0E1822; }
      .stroke { stroke: #0E1822; }
    }
  </style>
  <rect class="tile" width="64" height="64" rx="14" />
  <circle class="ink" cx="37" cy="15" r="5.5" />
  <path class="stroke" d="M37 27v15c0 7-4.5 10.5-12 10.5" stroke-width="9" stroke-linecap="round" />
</svg>
